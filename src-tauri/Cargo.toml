[package]
name = "kimi-usage-tracker"
version = "0.1.0"
description = "An unofficial local usage tracker for Kimi Code"
authors = ["Kimi Usage Tracker contributors"]
edition = "2024"
license = "MIT"
repository = "https://github.com/leolin-code/kimi-usage-tracker"
homepage = "https://github.com/leolin-code/kimi-usage-tracker"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
